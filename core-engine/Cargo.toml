[package]
name = "core-engine"
version = "0.1.0"
edition = "2021"
description = "CineSense core-engine: high-frequency multi-modal stream capture, normalization and emotion fusion"

[features]
# Optional real camera capture via OpenCV. Build with:
#   cargo build --release --features opencv
# (requires a system OpenCV 4 install; see https://github.com/twistedfall/opencv-rust)
default = []
opencv = ["dep:opencv"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opencv = { version = "0.92", optional = true }

[profile.release]
opt-level = 3

